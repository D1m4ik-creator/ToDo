<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Управляй задачами с AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-['Inter']">

    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('home')">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-xl">T</span>
                </div>
                <span class="font-bold text-xl tracking-tight">TaskFlow</span>
            </div>

            <div class="flex items-center gap-4">
                <div id="nav-links" class="flex gap-4">
                    <button onclick="showPage('login')" class="px-4 py-2 text-slate-600 hover:text-indigo-600 font-medium transition">Войти</button>
                    <button onclick="showPage('register')" class="px-5 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition">Начать бесплатно</button>
                </div>

                <button id="notifButton" class="relative p-2.5 text-slate-500 hover:bg-slate-100 rounded-xl transition hidden" onclick="Notifications.toggleModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span id="notifBadge" class="hidden"></span>
                </button>
            </div>
        </div>
    </nav>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl scale-in overflow-hidden">
            <div class="p-8">
                <h3 id="modal-title" class="text-2xl font-bold text-slate-800 mb-2">Новая команда</h3>
                <p id="modal-desc" class="text-slate-500 text-sm mb-6">Введите название вашей будущей команды.</p>

                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Название</label>
                <input type="text" id="team-modal-input"
                       class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium"
                       placeholder="Например: Отдел маркетинга">

                <div class="flex gap-3 mt-8">
                    <button onclick="closeTeamSettings()" class="flex-1 px-6 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition">Отмена</button>
                    <button id="modal-action-btn" class="flex-1 px-6 py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition">Создать</button>
                </div>

                <div id="modal-danger-zone" class="mt-8 pt-6 border-t border-rose-100 hidden">
                    <p class="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-3 ml-1">Опасная зона</p>
                    <button id="delete-team-btn" class="w-full px-6 py-3 rounded-xl font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 transition">Удалить команду</button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-popup" class="fixed bottom-6 right-6 w-80 h-[450px] bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col z-[1000] hidden transition-all duration-300">
        <div class="p-4 bg-indigo-600 text-white rounded-t-3xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div id="chat-avatar" class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center font-bold text-xs uppercase">?</div>
                <span id="chat-target-name" class="font-bold text-sm">Чат</span>
            </div>
            <button onclick="closeChat()" class="hover:bg-indigo-500 p-1 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50"></div>
        <div class="p-4 bg-white border-t border-slate-100 rounded-b-3xl">
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Ваше сообщение..."
                       class="flex-1 bg-slate-100 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                <button id="chat-send-btn" class="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] space-y-2"></div>

    <main id="app-content" class="pt-24 min-h-screen">
        </main>

    <div id="notif-modal-container"></div>

    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/teams.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
