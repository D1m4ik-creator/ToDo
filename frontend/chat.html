<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

<div class="user-selector">
    <input type="number" id="targetUserId" placeholder="ID собеседника (например, 2)">
    <button id="connectBtn">Начать чат</button>
</div>

<div id="chatWindow" class="chat-container" style="display: none;">
    <div class="chat-header" id="chatHeader">Чат с пользователем ...</div>
    <div id="messages" class="chat-messages"></div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Введите сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
